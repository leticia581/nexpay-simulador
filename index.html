<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Simulador NexPay</title>
<style>body{margin:0;background:#0E145B;color:#fff;font:15px Poppins,-apple-system,sans-serif;display:grid;place-items:center;min-height:100vh}</style>
</head>
<body>
<p id="m">Carregando o simulador…</p>
<script>
fetch('app.html?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.text()})
 .then(h=>{document.open();document.write(h);document.close()})
 .catch(()=>{location.replace('app.html')});
</script>
<noscript><a href="app.html" style="color:#AC95FB">Abrir o simulador</a></noscript>
</body>
</html>
